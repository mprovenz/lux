# Manual release builder for Lux: the desktop app and lux-light.
#
# Per platform (Linux x64, Windows x64) it publishes, through packaging/pack.sh:
#   lux-<version>-<rid>         plain archive with the app and lux-light (no installer, no self-update)
#   lux-light-<version>-<rid>   the command line tool alone
#   the installed build         Lux-win-Setup.exe / Lux.AppImage, which update themselves from this repository's releases
#                               (the *.nupkg and releases.<channel>.json files attached to the release are their update feed)

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag"
        required: true
        type: string
      platforms:
        description: "Platforms to build"
        type: choice
        default: all
        options:
          - all
          - linux
          - windows
      draft:
        description: "Create the release as a draft"
        type: boolean
        default: true
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      msbuild_version: ${{ steps.version.outputs.msbuild_version }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Validate the version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::version must look like v1.2.3 or v1.2.3-beta.1, got '$VERSION'"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "msbuild_version=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Select the platforms
        id: matrix
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          all='[
            {"family": "linux",   "os": "ubuntu-latest",  "rid": "linux-x64"},
            {"family": "windows", "os": "windows-latest", "rid": "win-x64"}
          ]'
          if [ "$PLATFORMS" = all ]; then
            sel=$(jq -c '{include: .}' <<< "$all")
          else
            sel=$(jq -c --arg f "$PLATFORMS" '{include: [.[] | select(.family == $f)]}' <<< "$all")
          fi
          echo "matrix=$sel" >> "$GITHUB_OUTPUT"
          echo "building: $(jq -r '[.include[].rid] | join(", ")' <<< "$sel")"

  build:
    name: Build ${{ matrix.rid }}
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Package
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          MSBUILD_VERSION: ${{ needs.plan.outputs.msbuild_version }}
        run: packaging/pack.sh "$MSBUILD_VERSION" "$RID" dist

      - name: Smoke test
        shell: bash
        env:
          RID: ${{ matrix.rid }}
        run: |
          exe="artifacts/pack/$RID/cli/lux-light"
          [ -f "$exe.exe" ] && exe="$exe.exe"
          "$exe" --help | head -3
          "$exe" version || true

      - uses: actions/upload-artifact@v7
        with:
          name: lux-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create the GitHub release
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Lux $VERSION" --generate-notes)
          if [ "$DRAFT" = true ]; then args+=(--draft); fi
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          gh release create "$VERSION" dist/* "${args[@]}"
