// reconstructed from liblricompression.dylib
syntax = "proto2";
package ltpb;

message GPSData {
  enum ReferenceNorth {
    REFERENCE_NORTH_MAGNETIC = 0;
    REFERENCE_NORTH_TRUE = 1;
  }
  enum ReferenceAltitude {
    REFERENCE_ALTITUDE_SEA_LEVEL = 0;
  }
  enum ProcessingMethod {
    PROCESSING_METHOD_UNKNOWN = 0;
    PROCESSING_METHOD_GPS = 1;
    PROCESSING_METHOD_CELLID = 2;
    PROCESSING_METHOD_WLAN = 3;
    PROCESSING_METHOD_MANUAL = 4;
    PROCESSING_METHOD_FUSED = 5;
  }
  message Track {
    required double value = 1;
    required GPSData.ReferenceNorth ref = 2;
  }
  message Heading {
    required double value = 1;
    required GPSData.ReferenceNorth ref = 2;
  }
  message Altitude {
    required double value = 1;
    required GPSData.ReferenceAltitude ref = 2;
  }
  optional double latitude = 1;
  optional double longitude = 2;
  optional uint64 timestamp = 3;
  optional double dop = 4;
  optional GPSData.Track track = 5;
  optional GPSData.Heading heading = 6;
  optional GPSData.Altitude altitude = 7;
  optional double speed = 8;
  optional GPSData.ProcessingMethod processing_method = 9;
}
